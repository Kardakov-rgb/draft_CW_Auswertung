<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auswertung (Demo-Version)</title>
    <meta name="description" content="Demo-Seite als Vorlage zur Übernahme ins bestehende System" />

    <!-- Stylesheets: Reihenfolge ist relevant (Fonts -> Tokens -> Base -> Layout -> Components) -->
    <link
      rel="preload"
      href="assets/fonts/montserrat-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/noto-serif-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body class="page">
    <a class="skip-link" href="#main">Zum Inhalt springen</a>

    <header class="site-header">
      <div class="container site-header__inner">
        <p class="site-header__title" data-app-title>Auswertung</p>
        <p class="site-header__badge" data-app-badge>Demo-Version</p>
      </div>
    </header>

    <main class="container page__main" id="main">
      <h1 class="page__heading">Auswertung</h1>

      <div class="toolbar" role="group" aria-label="Ansicht">
        <label class="toolbar__field">
          <span class="toolbar__label">KPF</span>
          <select class="toolbar__select" data-kpf-select></select>
        </label>
        <button class="button button--primary" type="button" data-export>Als PDF speichern</button>
      </div>

      <article class="report" data-report aria-label="Berichtsvorschau"></article>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p class="site-footer__text">
          Demo mit erfundenen Beispieldaten. Keine echten Namen, keine Zugangsdaten.
        </p>
      </div>
    </footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
